<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tirage 1–50</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #resultat {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Tirage aléatoire entre 1 et 50</h1>
  <button onclick="afficherTirage()">Tirer un nombre</button>
  <div id="resultat">—</div>

  <script>
    function tirageAleatoire() {
      return Math.floor(Math.random() * 50) + 1;
    }

    function afficherTirage() {
      const nombre = tirageAleatoire();
      document.getElementById("resultat").textContent = nombre;
    }
  </script>
</body>
</html>
